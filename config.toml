# Koyu tema. Açık temayı tercih ederseniz base/backgroundColor/
# secondaryBackgroundColor/textColor satırlarını README'deki blokla değiştirin.
# Ayrıca sağ üstteki ⋮ menüsünden Settings → Theme ile anlık geçiş yapabilirsiniz.

[theme]
base = "dark"
primaryColor = "#12AEB4"
backgroundColor = "#111A24"
secondaryBackgroundColor = "#1B2836"
textColor = "#EDF3F9"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
