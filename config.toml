# Koyu tema. Açık temayı tercih ederseniz base/backgroundColor/
# secondaryBackgroundColor/textColor satırlarını README'deki blokla değiştirin.
# Ayrıca sağ üstteki ⋮ menüsünden Settings → Theme ile anlık geçiş yapabilirsiniz.

[theme]
base = "dark"
# Tablodaki onay tikleri, AL/26 çubuğu ve kaydırıcılar bu rengi kullanır
primaryColor = "#1FB47C"
backgroundColor = "#111A24"
secondaryBackgroundColor = "#1B2836"
textColor = "#EDF3F9"
font = "sans serif"

[server]
headless = true
# PWA manifesti ve simgeleri bist_screener/static/ altindan sunulur
enableStaticServing = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
